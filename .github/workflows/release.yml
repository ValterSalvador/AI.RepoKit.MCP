name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v. Defaults to the current tag or project version.
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        shell: powershell
        run: |
          $version = "${{ inputs.version }}".Trim()

          if ([string]::IsNullOrWhiteSpace($version) -and $env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$project = Get-Content "src/AiRepoKit.Cli/AiRepoKit.Cli.csproj"
            $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve release version. Push a vX.Y.Z tag or pass workflow_dispatch input 'version'."
          }

          $version = $version.Trim()
          if ($version.StartsWith("v", [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if ($version -notmatch "^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$") {
            throw "Release version '$version' is not SemVer."
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Release version: $version"
          Write-Host "Release tag: v$version"

      - name: Build solution
        run: dotnet build AI.RepoKit.MCP.sln -c Release

      - name: Run v1.4.2 smoke tests
        run: powershell -ExecutionPolicy Bypass -File tests/v1.4.2-smoke.ps1

      - name: Run v1.4.3 smoke tests
        run: powershell -ExecutionPolicy Bypass -File tests/v1.4.3-smoke.ps1

      - name: Run v1.5.0 smoke tests
        run: powershell -ExecutionPolicy Bypass -File tests/v1.5.0-smoke.ps1

      - name: Run v1.6.0 smoke tests
        run: powershell -ExecutionPolicy Bypass -File tests/v1.6.0-smoke.ps1

      - name: Run v1.7.0 smoke tests
        run: powershell -ExecutionPolicy Bypass -File tests/v1.7.0-smoke.ps1

      - name: Run v1.8.0 smoke tests
        run: powershell -ExecutionPolicy Bypass -File tests/v1.8.0-smoke.ps1

      - name: Build release assets
        run: powershell -ExecutionPolicy Bypass -File scripts/Build-Release.ps1 -Version $env:RELEASE_VERSION

      - name: Verify release assets
        shell: powershell
        run: |
          $expectedAssets = @(
            "AiRepoKit.Cli.$env:RELEASE_VERSION.nupkg",
            "airepo-win-x64.zip",
            "airepo-linux-x64.tar.gz",
            "airepo-linux-arm64.tar.gz",
            "airepo-updater-win.zip",
            "airepo-updater-unix.tar.gz",
            "release-manifest.json"
          )

          foreach ($asset in $expectedAssets) {
            $path = Join-Path "artifacts/release" $asset
            if (-not (Test-Path $path)) {
              throw "Expected release asset not found: $path"
            }
          }

          Get-ChildItem "artifacts/release" -File | Sort-Object Name | Format-Table Name,Length -AutoSize

      - name: Create or update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $title = $tag
          $assetPaths = @(Get-ChildItem "artifacts/release" -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($assetPaths.Count -eq 0) {
            throw "No files found in artifacts/release; refusing to upload an empty release."
          }

          cmd /c "gh release view ""$tag"" --repo ""%GITHUB_REPOSITORY%"" >NUL 2>NUL"
          $releaseViewExitCode = $LASTEXITCODE
          if ($releaseViewExitCode -eq 0) {
            Write-Host "GitHub Release '$tag' already exists."
          } else {
            Write-Host "GitHub Release '$tag' does not exist; creating it from the existing tag."
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --title $title --generate-notes
            $releaseCreateExitCode = $LASTEXITCODE

            if ($releaseCreateExitCode -ne 0) {
              Write-Host "Generated release notes were unavailable; retrying with default notes."
              & gh release create $tag --repo $env:GITHUB_REPOSITORY --title $title --notes "Release $tag."
              $releaseCreateExitCode = $LASTEXITCODE
            }

            if ($releaseCreateExitCode -ne 0) {
              throw "Failed to create GitHub Release '$tag'."
            }
          }

          gh release upload $tag @assetPaths --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets for '$tag'."
          }
